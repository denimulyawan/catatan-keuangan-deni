<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget — Catatan Keuangan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=20260906b">
</head>
<body data-halaman="budget">
  <header id="site-header"></header>

  <main class="container halaman">
    <div class="baris-judul">
      <div>
        <h1>Budget Bulanan</h1>
        <p class="muted">Atur batas pengeluaran per kategori</p>
      </div>
    </div>

    <div class="card pemilih-bulan" id="pilih-bulan"></div>

    <section id="ringkasan-budget" class="grid-kpi" aria-label="Ringkasan budget"></section>

    <div class="card kartu-tabel">
      <div class="card-judul">
        <h2>Budget per Kategori</h2>
        <span class="muted" id="keterangan-budget"></span>
      </div>
      <div id="daftar-budget"></div>
      <p class="muted kecil catatan-budget">💡 Isi anggaran lalu klik <strong>Simpan</strong> pada baris yang diubah. Bar berwarna <span class="pil-status pil-normal">aman</span> &lt; 70%, <span class="pil-status pil-warning">peringatan</span> &gt; 70%, dan <span class="pil-status pil-over">terlampaui</span> ≥ 100%.</p>
    </div>
  </main>

  <nav id="nav-bawah" class="nav-bawah"></nav>
  <div id="area-toast"></div>

  <script src="js/app.js?v=20260906b"></script>
  <script src="js/api.js?v=20260906b"></script>
  <script src="js/budget.js?v=20260906b"></script>
</body>
</html>

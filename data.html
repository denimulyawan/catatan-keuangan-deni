<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Transaksi — Catatan Keuangan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=20260906a">
</head>
<body data-halaman="data">
  <header id="site-header"></header>

  <main class="container halaman">
    <div class="baris-judul">
      <div>
        <h1>Data Transaksi</h1>
        <p class="muted">Lihat, cari, ubah, dan hapus transaksi</p>
      </div>
      <a href="input.html" class="btn btn-primer btn-kecil">＋ Tambah</a>
    </div>

    <div class="card" id="kartu-filter">
      <div class="grid-filter">
        <div class="filter-cari">
          <label class="visually-hidden" for="cari">Cari transaksi</label>
          <input type="search" class="form-kontrol" id="cari" placeholder="🔍 Cari deskripsi / kategori…">
        </div>
        <div>
          <label class="visually-hidden" for="filter-bulan">Filter bulan</label>
          <select class="form-kontrol" id="filter-bulan"></select>
        </div>
        <div>
          <label class="visually-hidden" for="filter-kategori">Filter kategori</label>
          <select class="form-kontrol" id="filter-kategori"></select>
        </div>
        <div>
          <label class="visually-hidden" for="filter-dompet">Filter dompet</label>
          <select class="form-kontrol" id="filter-dompet"></select>
        </div>
        <div>
          <label class="visually-hidden" for="filter-tipe">Filter tipe</label>
          <select class="form-kontrol" id="filter-tipe">
            <option value="">Semua Tipe</option>
            <option value="Pemasukan">Pemasukan</option>
            <option value="Pengeluaran">Pengeluaran</option>
            <option value="Transfer">Transfer</option>
          </select>
        </div>
      </div>
      <p class="muted kecil" id="info-jumlah">Memuat data…</p>
    </div>

    <div class="card kartu-tabel">
      <div id="isi-data"></div>
    </div>
  </main>

  <nav id="nav-bawah" class="nav-bawah"></nav>
  <div id="area-toast"></div>

  <script src="js/app.js?v=20260906a"></script>
  <script src="js/api.js?v=20260906a"></script>
  <script src="js/data.js?v=20260906a"></script>
</body>
</html>
